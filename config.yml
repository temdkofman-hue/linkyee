# =============================================================================
# linkyee — Site Configuration
#
# This file is rendered through Liquid: every {{ ... }} below is evaluated
# at build time. Plugin output lives under `vars.<PluginName>` — see
# `plugins/README.md` for the full plugin developer wiki.
# =============================================================================

# Theme — directory under ./themes/. Built-ins:
#   default | minimal-mono | editorial-serif | neo-brutalism
#   glassmorphism | terminal-retro | paper-card | newsprint
theme: glassmorphism

# HTML <html lang> attribute
lang: "he"

# Force a color scheme regardless of the visitor's system appearance:
#   auto  — follow OS (default; the page auto-switches between light/dark)
#   light — always render light mode
#   dark  — always render dark mode
color_scheme: dark

# -----------------------------------------------------------------------------
# Plugins — every built-in plugin is shown below as a working example.
# Remove the ones you don't need. Output is referenced as {{ vars.PluginName }}.
# Full reference: plugins/README.md
# -----------------------------------------------------------------------------
plugins:
  # Latest video for YouTube channel automatically updated
  - YouTubeChannelLatestVideoPlugin:
      - "@nikasapoz"

# -----------------------------------------------------------------------------
# Tracking
# -----------------------------------------------------------------------------
google_analytics_id:

# -----------------------------------------------------------------------------
# Profile header
# -----------------------------------------------------------------------------
title: "Nika Sapoz - Links"
avatar: "https://files.kick.com/images/user/15317769/profile_image/conversion/66718420-b8c7-43c2-a9b0-27909eb62ff7-fullsize.webp"
name: "Nika Sapoz"
tagline: >-
  היי קוראים לי ניקה ואני מסטרימה בקיק! מוזמנים לעקוב ולהצטרף לקהילה שלי ברשתות.

# -----------------------------------------------------------------------------
# Links
#   icon  — Font Awesome class (https://fontawesome.com/search?o=r&m=free)
#   text  — displayed text (Liquid + HTML allowed)
#   title — link title attribute
#   url   — destination
#   alt   — accessibility text
#   target — `_blank` (new tab) or `_self`
# -----------------------------------------------------------------------------
links:
  # Kick Channel
  - link:
      icon: "fa-solid fa-headset"
      text: "Kick - הערוץ הרשמי שלי"
      url: "https://kick.com/nikasapoz"
      alt: "Nika Sapoz Kick Channel"
      title: "Kick LIVE"
      target: "_blank"

  # YouTube Channel
  - link:
      icon: "fa-brands fa-youtube"
      text: "YouTube - הערוץ הרשמי"
      url: "https://www.youtube.com/@nikasapoz"
      alt: "Nika Sapoz YouTube Channel"
      title: "YouTube Channel"
      target: "_blank"

  # Automatic Latest YouTube Video
  - link:
      icon: "fa-solid fa-play"
      text: "סרטון אחרון שעלה: {{ vars.YouTubeChannelLatestVideoPlugin['@nikasapoz'].title }}"
      url: "{{ vars.YouTubeChannelLatestVideoPlugin['@nikasapoz'].url }}"
      alt: "Latest YouTube Video"
      title: "Latest YouTube Video"
      target: "_blank"
      latest: true

  # Most Viewed Video (Manual Link)
  - link:
      icon: "fa-solid fa-fire"
      text: "הסרטון הנצפה ביותר ביוטיוב 🔥"
      url: "https://www.youtube.com/@nikasapoz/videos?view=0&sort=p"
      alt: "Most Viewed YouTube Video"
      title: "Most Viewed YouTube Video"
      target: "_blank"

  # Discord Server
  - link:
      icon: "fa-brands fa-discord"
      text: "הצטרפו לשרת ה-Discord"
      url: "https://discord.gg/tDYG8XZ6U4"
      alt: "Discord Server"
      title: "Discord Community"
      target: "_blank"

  # Instagram Profile
  - link:
      icon: "fa-brands fa-instagram"
      text: "Instagram"
      url: "https://www.instagram.com/veronika_sapoz/"
      alt: "Instagram Profile"
      title: "Instagram"
      target: "_blank"

# -----------------------------------------------------------------------------
# Social media buttons
# -----------------------------------------------------------------------------
socials:
  - social:
      icon: "fa-solid fa-headset"
      url: "https://kick.com/nikasapoz"
      title: "Kick"
      alt: "Kick"
      target: "_blank"
  - social:
      icon: "fa-brands fa-youtube"
      url: "https://www.youtube.com/@nikasapoz"
      title: "YouTube"
      alt: "YouTube"
      target: "_blank"
  - social:
      icon: "fa-brands fa-instagram"
      url: "https://www.instagram.com/veronika_sapoz/"
      title: "Instagram"
      alt: "Instagram"
      target: "_blank"
  - social:
      icon: "fa-brands fa-discord"
      url: "https://discord.gg/tDYG8XZ6U4"
      title: "Discord"
      alt: "Discord"
      target: "_blank"

# -----------------------------------------------------------------------------
# Footer
# -----------------------------------------------------------------------------
footer: >
  תודה שביקרתם בעמוד הקישורים שלי! מוזמנים להצטרף לשידורים החיים.

# Footer copyright message
copyright: >
  © {{ year }} <a href="https://kick.com/nikasapoz" target="_blank">Nika Sapoz</a>. Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">linkyee</a>
